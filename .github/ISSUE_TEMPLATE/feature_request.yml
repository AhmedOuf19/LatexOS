name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you run into, not just the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: >
        This is a small, local, single-user tool that must stay light and work
        offline. Features that fight those goals are unlikely to be accepted.
      options:
        - label: This keeps the app usable offline
        - label: This does not require a new heavyweight dependency
        - label: This does not require exposing the app to a network

  - type: checkboxes
    id: help
    attributes:
      label: Would you like to implement it?
      options:
        - label: I'd be willing to open a pull request for this
